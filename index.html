<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Karm - For Humanity | Social Platform for Social Good</title>
    <meta name="description" content="Join Karm - The Social Platform for Social Good. Connect students, colleges, NGOs, and citizens to collaborate on local social causes and make measurable community impact." />
    <script>
      // Initialize theme before React loads
      (function() {
        const savedTheme = localStorage.getItem('karm-theme');
        const systemTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        const theme = savedTheme || systemTheme;
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
